name: C007 K05-K06 kernel ridge screen
on:
  push:
    paths:
      - '.github/workflows/krr-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        config: [linear-krr-l001, linear-krr-l01, linear-krr-l1, rbf-krr-s05-l01, rbf-krr-s05-l1, rbf-krr-s1-l01, rbf-krr-s1-l1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate exact kernel ridge
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral krr data/raw/ksea 2019 predictions.csv ${{ matrix.config }} | tee metrics.txt
          gzip predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: c007-krr-2019-${{ matrix.config }}
          path: |
            metrics.txt
            predictions.csv.gz
          retention-days: 30
