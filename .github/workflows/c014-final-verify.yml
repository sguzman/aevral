name: C014 durable archival verification
on:
  push:
    paths:
      - '.github/workflows/c014-final-verify.yml'
      - 'campaigns/014-probabilistic/pool.rs'
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived assessment metadata
        run: |
          set -euo pipefail
          for year in 2021 2022; do
            (
              cd "results/C014/$year"
              awk '$1 ~ /^[0-9a-f]+$/ && length($1)==64 && $2 ~ /^(metrics\.csv|costs\.csv|P[0-9][0-9]-parameters\.csv)$/ {print}' assessment-audit.txt > /tmp/c014-hashes.txt
              test "$(wc -l < /tmp/c014-hashes.txt)" -eq 26
              sha256sum -c /tmp/c014-hashes.txt
              grep ',all,0,' metrics.csv | cmp - overall.csv
              echo "c014-durable,$year,26,pass"
            )
          done
      - name: Reproduce pooled diagnostics independently
        run: |
          set -euo pipefail
          rustc --edition=2021 -O campaigns/014-probabilistic/pool.rs -o /tmp/c014-pool
          /tmp/c014-pool results/C014/2021/metrics.csv results/C014/2022/metrics.csv /tmp/c014-pooled.csv
          cmp /tmp/c014-pooled.csv results/C014/pooled-diagnostics.csv
          sha256sum results/C014/pooled-diagnostics.csv
      - name: Publish verification gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [[ "$JOB_STATUS" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=aevral/c014-final-verify -f state="$state" \
            -f description="C014 archival and pooling: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
