name: C004 finalists A
on:
  push:
    paths:
      - '.github/workflows/c004-finalists-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: ['2020', '2021', '2022']
        group: [linear, sparse, robust, latent, basis, mars]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate frozen finalists
        run: |
          cargo build --locked --release
          bash scripts/c004-finalists-a.sh ${{ matrix.fold }} ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c004-finalists-a-${{ matrix.fold }}-${{ matrix.group }}
          path: results-run/
          retention-days: 30
