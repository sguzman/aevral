name: C015 final numerical archive
on:
  push:
    paths:
      - 'campaigns/015-tournament/finalize-launch.txt'
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and aggregate frozen results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r fits combinations < campaigns/015-tournament/finalize-launch.txt
          bash scripts/c015-finalize.sh "$fits" "$combinations" final-work
      - uses: actions/upload-artifact@v4
        with:
          name: c015-final-numerical-archive
          path: final-work/final/
          if-no-files-found: error
          retention-days: 90
      - name: Persist verified numerical archive to Git
        run: |
          set -euo pipefail
          (cd final-work/final; sha256sum -c SHA256SUMS)
          test ! -e results/C015/final
          mkdir -p results/C015/final
          cp -a final-work/final/. results/C015/final/
          (cd results/C015/final; sha256sum -c SHA256SUMS)
          git add -- results/C015/final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive independently verified C015 numerical evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git fetch origin main
          git diff --exit-code HEAD origin/main -- results/C015/final
