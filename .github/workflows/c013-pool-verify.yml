name: C013 pooled results verification
on:
  push:
    paths:
      - '.github/workflows/c013-pool-verify.yml'
      - 'campaigns/013-ensembles/pool-diagnostics.rs'
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persisted metadata hashes
        run: |
          set -euo pipefail
          cd results/C013
          awk '$2 ~ /^(metrics|coefficients|parameters)\.csv$/ && length($1)==64 {print}' assessment-audit.txt > /tmp/c013-meta.sha256
          test "$(wc -l < /tmp/c013-meta.sha256)" -eq 3
          sha256sum -c /tmp/c013-meta.sha256
          { head -n1 fold-scores.csv; grep '^score,' metrics.csv | cut -d, -f2-; } | cmp - fold-scores.csv
      - name: Reproduce pooled diagnostics independently
        run: |
          set -euo pipefail
          rustc --edition=2021 -O campaigns/013-ensembles/pool-diagnostics.rs -o /tmp/c013-pool
          /tmp/c013-pool results/C013/metrics.csv /tmp/c013-pooled.csv
          cmp /tmp/c013-pooled.csv results/C013/pooled-diagnostics.csv
          sha256sum results/C013/pooled-diagnostics.csv
          echo 'c013-pool-verify,1221,pass'
      - name: Publish gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [[ "$JOB_STATUS" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=aevral/c013-pool-verify -f state="$state" \
            -f description="C013 pooled results: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
