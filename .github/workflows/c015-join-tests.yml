name: C015 ensemble join tests
on:
  push:
    paths:
      - '.github/workflows/c015-join-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustc --edition=2021 --test campaigns/015-tournament/join.rs -o /tmp/join-tests
          /tmp/join-tests
          rustc --edition=2021 -O campaigns/015-tournament/join.rs -o /tmp/join
