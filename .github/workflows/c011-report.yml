name: C011 archived diagnostics audit
on:
  push:
    paths:
      - '.github/workflows/c011-report.yml'
      - 'scripts/c011-report.rs'
      - 'scripts/c011-recover-timing.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recover missing original job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/c011-recover-timing.sh
      - name: Audit all 348 archived compute diagnostics
        run: |
          set -euo pipefail
          rustc --edition=2021 -O scripts/c011-report.rs -o /tmp/c011-report
          /tmp/c011-report | tee /tmp/c011-costs.csv
          test "$(wc -l </tmp/c011-costs.csv)" -eq 30
      - uses: actions/upload-artifact@v4
        with:
          name: c011-costs
          path: |
            /tmp/c011-costs.csv
            /tmp/c011-timing-recovered.csv
          retention-days: 30
