name: C006 upstream backend availability
on:
  push:
    paths:
      - '.github/workflows/boosting-backend-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        backend: [xgboost, lightgbm, catboost]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Probe pinned backend
        run: |
          set -o pipefail
          bash scripts/probe-boosting-backends.sh "${{ matrix.backend }}" | tee backend-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c006-backend-${{ matrix.backend }}
          path: |
            backend-probe.txt
            *-version.txt
            *-help.txt
            *.err
          retention-days: 30
