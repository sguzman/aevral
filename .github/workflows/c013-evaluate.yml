name: C013 frozen ensemble assessment
on:
  push:
    paths:
      - '.github/workflows/c013-evaluate.yml'
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute frozen 48-outcome assessment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/c013-evaluate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: c013-assessment
          path: results-run/C013/out/
          retention-days: 30
      - name: Publish assessment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [[ "$JOB_STATUS" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=aevral/c013-evaluate -f state="$state" \
            -f description="Frozen C013 assessment: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
