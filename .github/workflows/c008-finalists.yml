name: C008 annual decomposition and alternative learner finalists
on:
  push:
    paths:
      - '.github/workflows/c008-finalists.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {method: 'D01', config: 'fourier-k6-l001', fold: '2020', seed: 'deterministic'}
          - {method: 'D01', config: 'fourier-k6-l001', fold: '2021', seed: 'deterministic'}
          - {method: 'D01', config: 'fourier-k6-l001', fold: '2022', seed: 'deterministic'}
          - {method: 'D01', config: 'fourier-k6-l01', fold: '2020', seed: 'deterministic'}
          - {method: 'D01', config: 'fourier-k6-l01', fold: '2021', seed: 'deterministic'}
          - {method: 'D01', config: 'fourier-k6-l01', fold: '2022', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l001', fold: '2020', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l001', fold: '2021', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l001', fold: '2022', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l01', fold: '2020', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l01', fold: '2021', seed: 'deterministic'}
          - {method: 'D02', config: 'haar-m32-l01', fold: '2022', seed: 'deterministic'}
