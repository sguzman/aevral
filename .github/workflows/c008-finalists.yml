          - {method: 'D03', config: 'ssa-l24-r8', fold: '2022', seed: 'deterministic'}
          - {method: 'D03', config: 'ssa-l36-r8', fold: '2020', seed: 'deterministic'}
          - {method: 'D03', config: 'ssa-l36-r8', fold: '2021', seed: 'deterministic'}
          - {method: 'D03', config: 'ssa-l36-r8', fold: '2022', seed: 'deterministic'}
          - {method: 'D04', config: 'dmd-l24-r8', fold: '2020', seed: 'deterministic'}
