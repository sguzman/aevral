          - {method: 'D08', config: 'markov-b16-hour', fold: '2021', seed: 'deterministic'}
          - {method: 'D08', config: 'markov-b16-hour', fold: '2022', seed: 'deterministic'}
          - {method: 'D08', config: 'markov-b8-hour', fold: '2020', seed: 'deterministic'}
          - {method: 'D08', config: 'markov-b8-hour', fold: '2021', seed: 'deterministic'}
          - {method: 'D08', config: 'markov-b8-hour', fold: '2022', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth1-t8', fold: '2020', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth1-t8', fold: '2021', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth1-t8', fold: '2022', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth2-t8', fold: '2020', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth2-t8', fold: '2021', seed: 'deterministic'}
          - {method: 'D09', config: 'symbolic-depth2-t8', fold: '2022', seed: 'deterministic'}
    env:
      METHOD: ${{ matrix.method }}
      CONFIG: ${{ matrix.config }}
      FOLD: ${{ matrix.fold }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Native numerical tests and locked build
        run: |
          cargo test --locked --release
          cargo build --locked --release
      - name: Evaluate frozen finalist
        run: bash scripts/c008-finalist.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c008-finalist-${{ matrix.method }}-${{ matrix.fold }}-${{ matrix.config }}-${{ matrix.seed }}
          path: results-run/
          retention-days: 30
