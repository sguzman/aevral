name: C008 D03-D05 dynamical systems screen
on:
  push:
    paths:
      - '.github/workflows/dyn-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        config: [ssa-l24-r4, ssa-l24-r8, ssa-l36-r4, ssa-l36-r8, dmd-l12-r4, dmd-l12-r8, dmd-l24-r4, dmd-l24-r8, edmd-l6-l001, edmd-l6-l01, edmd-l12-l001, edmd-l12-l01]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate SSA DMD and EDMD
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral dyn data/raw/ksea 2019 predictions.csv ${{ matrix.config }} | tee metrics.txt
          gzip predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: c008-dyn-2019-${{ matrix.config }}
          path: |
            metrics.txt
            predictions.csv.gz
          retention-days: 30
