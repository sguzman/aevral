name: C007 official LIBSVM backend probe
on:
  push:
    paths:
      - '.github/workflows/libsvm-probe.yml'
      - 'scripts/libsvm-probe.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Inspect locked official LIBSVM package
        run: |
          set -o pipefail
          nix develop .#svr --no-update-lock-file --command bash scripts/libsvm-probe.sh | tee probe.txt
          git diff --exit-code -- flake.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c007-libsvm-probe
          path: probe.txt
          retention-days: 30
