name: C009 N14 N15 attention screens
on:
  push:
    paths:
      - '.github/workflows/c009-attention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {method: 'N14', config: 'patchtst-p6-d16', fold: '2019', seed: '42'}
          - {method: 'N14', config: 'patchtst-p3-d16', fold: '2019', seed: '42'}
          - {method: 'N15', config: 'attention-p6-d8', fold: '2019', seed: '42'}
          - {method: 'N15', config: 'attention-p3-d8', fold: '2019', seed: '42'}
          - {method: 'N15', config: 'attention-p6-d16', fold: '2019', seed: '42'}
    env:
      METHOD: ${{ matrix.method }}
      CONFIG: ${{ matrix.config }}
      FOLD: ${{ matrix.fold }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Native numerical tests and locked build
        run: |
          cargo test --locked --release
          cargo build --locked --release
      - name: Evaluate frozen screen
        run: bash scripts/c009-screen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c009-screen-${{ matrix.method }}-${{ matrix.fold }}-${{ matrix.config }}-${{ matrix.seed }}
          path: results-run/
          retention-days: 30
