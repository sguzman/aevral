name: C014 probabilistic engine tests
on:
  push:
    paths:
      - '.github/workflows/c014-engine-tests.yml'
      - 'campaigns/014-probabilistic/*.rs'
permissions:
  contents: read
  statuses: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test synthetic fixtures only
        run: |
          rustc --edition=2021 --test campaigns/014-probabilistic/probabilistic.rs -O -o /tmp/c014-tests
          /tmp/c014-tests
          rustc --edition=2021 --test campaigns/014-probabilistic/reconstruct.rs -O -o /tmp/c014-reconstruct-tests
          /tmp/c014-reconstruct-tests
          rustc --edition=2021 --test campaigns/014-probabilistic/audit.rs -O -o /tmp/c014-audit-tests
          /tmp/c014-audit-tests
          rustc --edition=2021 -O campaigns/014-probabilistic/audit.rs -o /tmp/c014-audit
          rustc --edition=2021 -O campaigns/014-probabilistic/score.rs -o /tmp/c014-score
      - name: Publish test gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [[ "$JOB_STATUS" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=aevral/c014-engine-tests -f state="$state" \
            -f description="C014 synthetic tests: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
