name: C004 L03-L04 sparse screen
on:
  push:
    paths:
      - '.github/workflows/sparse-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Screen all ten sparse configurations
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral sparse data/raw/ksea 2019 predictions.csv all | tee metrics.txt
          gzip predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: c004-sparse-2019
          path: |
            metrics.txt
            predictions.csv.gz
          retention-days: 30
