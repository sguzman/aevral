name: C008 D06-D07 random learners screen
on:
  push:
    paths:
      - '.github/workflows/random-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        config: [esn-m64-leak03, esn-m64-leak1, esn-m128-leak03, esn-m128-leak1, elm-m64-l001, elm-m64-l01, elm-m128-l001, elm-m128-l01]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate echo-state and extreme learning machines
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral random-learner data/raw/ksea 2019 predictions.csv ${{ matrix.config }} 42 | tee metrics.txt
          gzip predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: c008-random-2019-${{ matrix.config }}
          path: |
            metrics.txt
            predictions.csv.gz
          retention-days: 30
