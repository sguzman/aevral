name: AEV-002 window comparison
on:
  push:
    paths:
      - 'src/windows.rs'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2022-v1
          restore-keys: |
            ksea-routine-utc-2018-v1
      - name: Restore or acquire snapshot
        run: bash scripts/fetch-ksea.sh 2000 2022
      - name: Verify frozen hashes
        run: |
          cd data/raw/ksea
          sha256sum -c ../../../results/AEV-001/snapshot.sha256
      - name: Compare windows
        run: |
          set -o pipefail
          git rev-parse HEAD > commit.txt
          cargo run --locked --release -- windows 2000 2022 data/raw/ksea | tee windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aev-002-windows
          path: |
            commit.txt
            windows.txt
