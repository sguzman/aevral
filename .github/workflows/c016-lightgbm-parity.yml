name: C016 split LightGBM parity
# Verify v2 artifact framing and locked backend metadata.
on:
  push:
    paths:
      - '.github/workflows/c016-lightgbm-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Verify independent training and prediction
        run: |
          set -euo pipefail
          nix develop .#boosting --no-update-lock-file --command cargo test --locked --release features::tournament::upstream::deployment_tests::split_lightgbm_parity -- --ignored --exact --nocapture | tee parity.log
          grep -Fx 'lightgbm-split-parity,24,pass' parity.log
          git diff --exit-code -- flake.lock
