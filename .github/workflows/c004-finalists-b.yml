name: C004 finalists B
on:
  push:
    paths:
      - '.github/workflows/c004-finalists-b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fold: ['2020', '2021', '2022']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate both frozen polynomial finalists
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral basis data/raw/ksea ${{ matrix.fold }} predictions.csv 'poly-full:1e-3,1e-2' | tee metrics.txt
          gzip predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: c004-finalists-b-${{ matrix.fold }}
          path: |
            metrics.txt
            predictions.csv.gz
          retention-days: 30
