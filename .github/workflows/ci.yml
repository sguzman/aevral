name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests
        run: cargo test --locked
      - name: Synthetic training smoke
        run: cargo run --locked --release -- smoke
      - name: Acquisition script syntax
        run: bash -n scripts/fetch-ksea.sh
