name: C006 native annual finalists
on:
  push:
    paths:
      - '.github/workflows/c006-finalists-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {fold: '2019', group: forest, seed: '123'}
          - {fold: '2019', group: forest, seed: '2026'}
          - {fold: '2020', group: cart, seed: 'deterministic'}
          - {fold: '2020', group: boosting, seed: 'deterministic'}
          - {fold: '2020', group: forest, seed: '42'}
          - {fold: '2020', group: forest, seed: '123'}
          - {fold: '2020', group: forest, seed: '2026'}
          - {fold: '2021', group: cart, seed: 'deterministic'}
          - {fold: '2021', group: boosting, seed: 'deterministic'}
          - {fold: '2021', group: forest, seed: '42'}
          - {fold: '2021', group: forest, seed: '123'}
          - {fold: '2021', group: forest, seed: '2026'}
          - {fold: '2022', group: cart, seed: 'deterministic'}
          - {fold: '2022', group: boosting, seed: 'deterministic'}
          - {fold: '2022', group: forest, seed: '42'}
          - {fold: '2022', group: forest, seed: '123'}
          - {fold: '2022', group: forest, seed: '2026'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Evaluate frozen finalists
        run: |
          cargo build --locked --release
          bash scripts/c006-finalists.sh ${{ matrix.fold }} ${{ matrix.group }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c006-finalists-native-${{ matrix.fold }}-${{ matrix.group }}-${{ matrix.seed }}
          path: results-run/
          retention-days: 30
