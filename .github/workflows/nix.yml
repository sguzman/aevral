name: Nix reproducibility
on:
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Generate or verify lock
        run: |
          if test -f flake.lock; then
            nix flake metadata --no-update-lock-file
            git diff --exit-code -- flake.lock
          else
            nix flake lock
            git add flake.lock
          fi
          echo "AEVRAL_LOCK_JSON=$(jq -c . flake.lock)"
      - uses: actions/upload-artifact@v4
        with:
          name: nix-lock
          path: flake.lock
      - name: Verify locked development shell
        run: |
          nix develop --no-update-lock-file --command cargo test --locked
          nix develop --no-update-lock-file --command cargo run --locked --release -- smoke
