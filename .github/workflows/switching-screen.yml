name: C005 S12-S13 switching and GARCH screen
on:
  push:
    paths:
      - '.github/workflows/switching-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        config: [switch-ar1, switch-ar6, garch-ar6, garch-ar24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/ksea
          key: ksea-routine-utc-2000-2026-jan-oct-v1
          fail-on-cache-miss: true
      - name: Verify frozen archive
        run: cd data/raw/ksea && sha256sum -c ../../../results/AEV-015/snapshot.sha256
      - name: Numerical tests
        run: cargo test --locked --release
      - name: Fit switching or conditional variance model
        run: |
          set -o pipefail
          cargo build --locked --release
          /usr/bin/time -v target/release/aevral switching data/raw/ksea 2019 predictions.csv ${{ matrix.config }} | tee metrics.txt
          gzip predictions.csv
          if test -f predictions.variance.csv; then gzip predictions.variance.csv; fi
      - uses: actions/upload-artifact@v4
        with:
          name: c005-switching-2019-${{ matrix.config }}
          path: |
            metrics.txt
            predictions.csv.gz
            predictions.variance.csv.gz
          retention-days: 30
