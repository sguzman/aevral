name: C015 P13 independent audit tests
on:
  push:
    paths:
      - '.github/workflows/c015-p13-audit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          rustc --edition=2021 --test campaigns/015-tournament/audit-p13.rs -o /tmp/p13-tests
          /tmp/p13-tests
          rustc --edition=2021 -O campaigns/015-tournament/audit-p13.rs -o /tmp/p13-audit
